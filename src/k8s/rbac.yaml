# k8s/rbac.yaml (ПРАВИЛЬНОЕ СОДЕРЖИМОЕ)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-scaler-sa
  namespace: messenger-app # Укажите ваш неймспейс
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-scaler-role
  namespace: messenger-app # Укажите ваш неймспейс
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"] # Право масштабировать Deployment
    verbs: ["get", "patch", "update"]
  - apiGroups: [""] # Доступ к подам (для чтения метрик CPU через API, если нужно, или для логов)
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-scaler-binding
  namespace: messenger-app # Укажите ваш неймспейс
subjects:
  - kind: ServiceAccount
    name: ml-scaler-sa         # Имя ServiceAccount
    namespace: messenger-app    # Неймспейс ServiceAccount
roleRef:
  kind: Role
  name: ml-scaler-role       # Имя Role, которую привязываем
  apiGroup: rbac.authorization.k8s.io