apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
spec:
  template:
    spec:
      containers:
      - name: k6
        image: loadimpact/k6
        command: ["k6", "run", "-u", "100", "-d", "300s", "/tests/load-test.js"]
        volumeMounts:
        - name: load-test-volume
          mountPath: /tests
      volumes:
      - name: load-test-volume
        configMap:
          name: load-test-config
      restartPolicy: Never
  backoffLimit: 4