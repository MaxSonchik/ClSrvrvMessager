apiVersion: v1
kind: ConfigMap
metadata:
  name: jmeter-test-plan # Имя ConfigMap
  namespace: messenger-app # Убедитесь, что неймспейс совпадает с вашим
data:
  # Имя файла, как он будет виден в контейнере
  messenger_test.jmx: |
    <?xml version="1.0" encoding="UTF-8"?>
    <jmeterTestPlan version="1.2" properties="5.0" jmeter="5.6.3">
      <hashTree>
        <TestPlan guiclass="TestPlanGui" testclass="TestPlan" testname="Messenger TCP Load Test">
          <boolProp name="TestPlan.functional_mode">false</boolProp>
          <boolProp name="TestPlan.tearDown_on_shutdown">true</boolProp>
          <boolProp name="TestPlan.serialize_threadgroups">false</boolProp>
          <elementProp name="TestPlan.user_defined_variables" elementType="Arguments" guiclass="ArgumentsPanel" testclass="Arguments" testname="User Defined Variables">
            <collectionProp name="Arguments.arguments"/>
          </elementProp>
        </TestPlan>
        <hashTree>
          <ThreadGroup guiclass="ThreadGroupGui" testclass="ThreadGroup" testname="Messenger Users">
            <!-- КОНФИГУРАЦИЯ НАГРУЗКИ -->
            <intProp name="ThreadGroup.num_threads">50</intProp> <!-- Количество одновременных пользователей -->
            <intProp name="ThreadGroup.ramp_time">30</intProp> <!-- Время (сек) на запуск всех пользователей -->
            <boolProp name="ThreadGroup.scheduler">true</boolProp> <!-- Использовать настройки длительности -->
            <longProp name="ThreadGroup.duration">300</longProp> <!-- Длительность теста (сек) = 5 минут -->
            <longProp name="ThreadGroup.delay">0</longProp>
            <stringProp name="ThreadGroup.on_sample_error">continue</stringProp>
            <elementProp name="ThreadGroup.main_controller" elementType="LoopController" guiclass="LoopControlPanel" testclass="LoopController" testname="Loop Controller">
              <intProp name="LoopController.loops">-1</intProp>
              <boolProp name="LoopController.continue_forever">false</boolProp>
            </elementProp>
          </ThreadGroup>
          <hashTree>
            <!-- СЦЕНАРИЙ ПОЛЬЗОВАТЕЛЯ -->

            <!-- Шаг 1: Подключение -->
            <TCPSampler guiclass="TCPSamplerGui" testclass="TCPSampler" testname="TCP Connect">
              <stringProp name="TCPSampler.server">messenger-service.messenger-app.svc.cluster.local</stringProp>
              <stringProp name="TCPSampler.port">8080</stringProp>
              <stringProp name="TCPSampler.classname">TCPClientImpl</stringProp>
              <stringProp name="TCPSampler.ctimeout">5000</stringProp>
              <stringProp name="TCPSampler.timeout">10000</stringProp>
              <stringProp name="TCPSampler.request">{ "event": "connect", "from": "user-${__threadNum}" }</stringProp>
              <boolProp name="TCPSampler.reUseConnection">false</boolProp>
              <boolProp name="TCPSampler.closeConnection">false</boolProp> <!-- НЕ закрываем, нужно для след. шага -->
              <boolProp name="TCPSampler.nodelay">false</boolProp>
              <stringProp name="TCPSampler.EOL">10</stringProp> <!-- Байт конца строки (\n) -->
              <stringProp name="ConfigTestElement.input_encoding">UTF-8</stringProp>
            </TCPSampler>
            <hashTree/>

            <!-- Шаг 2: Пауза -->
            <ConstantTimer guiclass="ConstantTimerGui" testclass="ConstantTimer" testname="Pause after Connect">
              <stringProp name="ConstantTimer.delay">500</stringProp> <!-- 500 ms -->
            </ConstantTimer>
            <hashTree/>

            <!-- Шаг 3: Отправка сообщения -->
            <TCPSampler guiclass="TCPSamplerGui" testclass="TCPSampler" testname="TCP Send Message">
               <stringProp name="TCPSampler.server"></stringProp> <!-- Пусто, т.к. reUseConnection=true -->
               <stringProp name="TCPSampler.port"></stringProp>   <!-- Пусто, т.к. reUseConnection=true -->
              <stringProp name="TCPSampler.classname">TCPClientImpl</stringProp>
              <stringProp name="TCPSampler.ctimeout">5000</stringProp>
              <stringProp name="TCPSampler.timeout">10000</stringProp>
              <stringProp name="TCPSampler.request">{ "event": "message", "from": "user-${__threadNum}", "to": "user-${__threadNum}", "text": "Hello JMeter message ${__counter(TRUE)}" }</stringProp>
              <boolProp name="TCPSampler.reUseConnection">true</boolProp> <!-- Используем открытое соединение -->
              <boolProp name="TCPSampler.closeConnection">true</boolProp> <!-- Закрываем после этого сообщения -->
              <boolProp name="TCPSampler.nodelay">false</boolProp>
              <stringProp name="TCPSampler.EOL">10</stringProp>
              <stringProp name="ConfigTestElement.input_encoding">UTF-8</stringProp>
            </TCPSampler>
            <hashTree/>

            <!-- СОХРАНЕНИЕ РЕЗУЛЬТАТОВ -->
            <ResultCollector guiclass="SimpleDataWriter" testclass="ResultCollector" testname="Save Results to JTL">
              <!-- Путь внутри контейнера, куда будут сохраняться результаты -->
              <stringProp name="filename">/results/results.jtl</stringProp>
              <boolProp name="ResultCollector.error_logging">false</boolProp>
              <objProp>
                <name>saveConfig</name>
                <value class="SampleSaveConfiguration">
                  <time>true</time>
                  <latency>true</latency>
                  <timestamp>true</timestamp>
                  <success>true</success>
                  <label>true</label>
                  <code>true</code>
                  <message>true</message>
                  <threadName>true</threadName>
                  <dataType>false</dataType>
                  <encoding>false</encoding>
                  <assertions>true</assertions>
                  <subresults>false</subresults>
                  <responseData>false</responseData>
                  <samplerData>false</samplerData>
                  <xml>false</xml> <!-- ВАЖНО: Сохранять как CSV -->
                  <fieldNames>true</fieldNames>
                  <responseHeaders>false</responseHeaders>
                  <requestHeaders>false</requestHeaders>
                  <responseDataOnError>false</responseDataOnError>
                  <saveAssertionResultsFailureMessage>true</saveAssertionResultsFailureMessage>
                  <assertionsResultsToSave>0</assertionsResultsToSave>
                  <bytes>true</bytes>
                  <sentBytes>true</sentBytes>
                  <url>false</url>
                  <threadCounts>true</threadCounts>
                  <idleTime>true</idleTime>
                  <connectTime>true</connectTime>
                </value>
              </objProp>
            </ResultCollector>
            <hashTree/>

          </hashTree> <!-- Конец Thread Group -->
        </hashTree> <!-- Конец Test Plan -->
      </hashTree>
    </jmeterTestPlan>

---
apiVersion: batch/v1
kind: Job
metadata:
  name: jmeter-load-test-job # Имя Job'а
  namespace: messenger-app # Убедитесь, что неймспейс совпадает с вашим
spec:
  parallelism: 1 # Достаточно одного пода JMeter, он сам управляет потоками
  completions: 1 # Job считается выполненным после 1 успешного пода
  backoffLimit: 1 # Количество попыток перезапуска в случае ошибки пода
  template: # Шаблон пода для Job'а
    metadata:
      labels:
        app: jmeter-load-test # Метка для пода
    spec:
      containers:
      - name: jmeter-client # Имя контейнера
        image: justb4/jmeter:latest # Готовый образ JMeter
        # Команда для запуска JMeter в non-GUI режиме
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Preparing JMeter test..."
            # Создаем папку для результатов внутри контейнера
            mkdir -p /results
            echo "Starting JMeter test..."
            # Запускаем JMeter:
            # -n : Non-GUI mode
            # -t : Путь к плану теста (.jmx файл, смонтированный из ConfigMap)
            # -l : Путь к файлу лога результатов (.jtl файл)
            # -j : Путь к лог-файлу самого JMeter
            # -e : Генерировать HTML отчет в конце теста
            # -o : Папка для сохранения HTML отчета
            /entrypoint.sh \
              -n \
              -t /scripts/messenger_test.jmx \
              -l /results/results.jtl \
              -j /results/jmeter.log \
              -e -o /results/report

            EXIT_CODE=$? # Сохраняем код завершения JMeter
            echo "JMeter process finished with exit code ${EXIT_CODE}."
            echo "Results are available in /results directory inside the pod."
            echo "Pod will remain running for manual result copying. Use 'kubectl cp ...'"
            # Держим контейнер запущенным, чтобы можно было скопировать результаты
            sleep infinity
            # exit ${EXIT_CODE} # Можно завершить Job с кодом JMeter, если не нужен sleep
        volumeMounts:
        - name: jmeter-scripts # Имя тома, которое будет создано ниже
          mountPath: /scripts # Куда монтировать ConfigMap с .jmx файлом
          readOnly: true # Монтировать только для чтения
      volumes:
      - name: jmeter-scripts # Имя тома, должно совпадать с volumeMounts.name
        configMap:
          name: jmeter-test-plan # Имя ConfigMap, созданного выше
          # Указываем, какие ключи из ConfigMap монтировать как файлы
          items:
            - key: messenger_test.jmx # Ключ в ConfigMap.data
              path: messenger_test.jmx # Имя файла внутри mountPath (/scripts/messenger_test.jmx)
      restartPolicy: Never # Не перезапускать под после завершения Job'а