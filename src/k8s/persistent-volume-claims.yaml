apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: messenger-db-pvc
  namespace: messenger-app 
spec:
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
  namespace: messenger-app 
spec:
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 100Mi 